# school_pipeline 設定ファイルの例。
# コピーして config.yaml として使ってください(config.yaml と secrets/ は .gitignore 済みです)。
#
#   cp config.example.yaml config.yaml

anthropic_api_key_env: ANTHROPIC_API_KEY
anthropic_model: claude-sonnet-5

# Gmailアカウント(学校共通アドレス・専門コース用アドレスなど複数登録可能)
gmail_accounts:
  - name: school_common
    credentials_path: secrets/gmail_common_credentials.json
    token_path: secrets/gmail_common_token.json
    query: "newer_than:14d"
    max_results: 50
  - name: course_specific
    credentials_path: secrets/gmail_course_credentials.json
    token_path: secrets/gmail_course_token.json
    query: "newer_than:14d"
    max_results: 50

# 配布プリントPDFを置くフォルダ(通常のテキスト抽出に失敗した場合は自動でOCR)
pdf_directory: inbox/pdfs

# スマホで撮影したプリント写真を置くフォルダ(OCR)
image_directory: inbox/photos

# Classroomの投稿など、API非対応の情報を手動でコピペしたテキストファイルを置くフォルダ
manual_text_directory: inbox/manual

# 抽出済みの予定(JSON)を置くフォルダ。
# 配布物の読み取りを Claude Code などの対話セッションで行い、その結果をここに置くと、
# Anthropic API を呼ばずにカレンダーへ登録できる(APIキーも不要)。
# 形式は docs/extraction-format.md を参照。
extracted_events_directory: inbox/extracted

# 教科ごとの授業予定表(Excel)を置くフォルダ。
# 行が日付に対応した表なので、LLMには渡さず「提出」「小テスト」「チャレ」列を
# 決め打ちで読む。API費用がかからず、解釈のぶれも起きない。
xlsx_directory: inbox/xlsx
# 読み取るシート名(部分一致)。クラス別にシートが分かれている表で、
# 他クラスの日程を取り込む事故を防ぐために使う。省略すると全シートが対象。
xlsx_sheets_include:
  - "2-1"
# Excel由来の予定に付ける科目名。省略するとファイル名から推測する。
xlsx_subject: 英語

# Googleカレンダー
google_credentials_path: secrets/calendar_credentials.json
google_calendar_token_path: secrets/calendar_token.json
# 時刻指定のある予定を登録するときのタイムゾーン(IANA名)
timezone: Asia/Tokyo

calendar_id: primary   # 専用カレンダーを作ってそのIDを指定することを推奨

# この確信度未満の予定はカレンダーに登録せず、一覧表示のみ行う (0.0〜1.0)
confidence_threshold: 0.5

# カレンダーに載せたくない予定を指定するルールファイル
# (exclusions.example.yaml をコピーして使う。exclusions.yaml は .gitignore 済み)
exclusions_path: exclusions.yaml

# 終日イベントがこの日数を超えて続く場合、日付が特定できていない疑いがあるとみなして
# 確信度を下げる。「9月中のどこか1日」のような連絡が、月まるごとの予定として
# 登録されてしまうのを防ぐため。
max_span_days: 14

# 自分の子どものクラス。同じ種類のプリントがクラス別・担当者別に別バージョンで
# 配られることがあるため、対象が違う資料を取り込んだときに警告を出すのに使う。
my_class: "1組"

# クラスの別名。1クラスしかないコースに在籍している場合など、配布物が
# クラス番号ではなくコース名で対象を書いてくることがある。ここに並べておくと、
# それらも自分のクラス向けとして扱われる。
my_class_aliases:
  - "〇〇コース"

# 配布物には書かれていないが、日付の解釈に必要な前提を自由文で書く。
# そのままプロンプトに追記されるので、普通の日本語で構わない。
# 「○日の週」のような週単位の指定を実施日に直すには、時間割の知識が要る。
# それは資料に載っていないので、ここで補う。
# 内容を変えると抽出キャッシュが無効になり、次回は全ファイル再抽出になる。
extraction_notes:
  - "国語の小テストは毎週金曜日に実施される。資料に「9月7日の週」のように週で書かれていたら、その週の金曜日の日付に直すこと。"

# 内容が変わっていないファイルの再抽出(=再課金)を防ぐキャッシュの保存先
cache_path: .school_pipeline_cache.json

# API使用量と残高の目安を記録するファイル
usage_ledger_path: .school_pipeline_usage.json

# 費用を円換算して表示するときのレート
jpy_per_usd: 155
